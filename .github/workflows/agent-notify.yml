name: Agent Activity Notify

# Deterministic Slack notifications for agent-pipeline milestones. This is
# deliberately a PLAIN GitHub Actions workflow, not one of the gh-aw
# agent-*.md workflows, and it does not run as part of them.
#
# Why: agent-research.md/agent-dev.md/agent-review.md run read-only and can
# only write through declared safe-outputs. An earlier version of this
# template had them emit a `slack-notify` custom safe-output themselves —
# but that made the notification (whether it fires at all, and what it
# says) depend on the agent's own run completing and correctly narrating
# what it did. If a run errored, timed out, or just skipped the
# instruction, there'd be silence instead of a message; if it ran, the
# Slack content was the agent's self-report rather than a verified fact.
#
# This workflow instead watches the actual GitHub side effects the agents
# (or a human doing the same steps by hand) produce — a PR with a specific
# label opening, a review being submitted — and reads real event data
# (title, author, review state) to build the message. It fires the same way
# whether a human or an agent did the work, same as ci.yml/deploy.yml don't
# care who pushed the commit.

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-drafted:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'spec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          title: "Spec drafted"
          summary: "<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}>: ${{ github.event.pull_request.title }}"
          fields: |
            [
              {"label": "Opened by", "value": "${{ github.event.pull_request.user.login }}"},
              {"label": "Branch", "value": "${{ github.event.pull_request.head.ref }}"}
            ]
          link: "${{ github.event.pull_request.html_url }}"
          link-text: "Review spec PR"

  implementation-opened:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'agent-generated')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          title: "Implementation PR opened"
          summary: "<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}>: ${{ github.event.pull_request.title }}"
          fields: |
            [
              {"label": "Opened by", "value": "${{ github.event.pull_request.user.login }}"},
              {"label": "Branch", "value": "${{ github.event.pull_request.head.ref }}"}
            ]
          link: "${{ github.event.pull_request.html_url }}"
          link-text: "Review implementation PR"

  review-submitted:
    if: >-
      github.event_name == 'pull_request_review' &&
      contains(github.event.pull_request.labels.*.name, 'agent-generated') &&
      (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ github.event.review.state == 'approved' && 'success' || 'warning' }}
          title: ${{ github.event.review.state == 'approved' && 'PR approved' || 'Changes requested' }}
          summary: "<${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}>: ${{ github.event.pull_request.title }}"
          fields: |
            [
              {"label": "Reviewer", "value": "${{ github.event.review.user.login }}"},
              {"label": "Verdict", "value": "${{ github.event.review.state }}"}
            ]
          link: "${{ github.event.pull_request.html_url }}"
          link-text: "View PR"
