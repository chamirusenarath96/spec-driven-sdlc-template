name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      result: ${{ steps.deploy.outcome }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # --- Replace with your real deploy steps (Vercel/Fly/ECS/...) ---
      - name: Deploy
        id: deploy
        run: |
          echo "TODO: deploy"
          echo "url=https://example.com" >> "$GITHUB_OUTPUT"
      # ------------------------------------------------------------

      - name: Notify Slack
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          title: "Deploy ${{ job.status }} — ${{ github.repository }}"
          summary: "`${{ github.sha }}` deployed to **production**"
          fields: |
            [
              {"label": "Environment", "value": "production"},
              {"label": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"},
              {"label": "URL", "value": "${{ steps.deploy.outputs.url }}"},
              {"label": "Triggered by", "value": "${{ github.actor }}"}
            ]
          link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          link-text: "View deploy run"
