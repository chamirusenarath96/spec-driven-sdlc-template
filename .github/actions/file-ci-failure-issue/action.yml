name: "File CI failure issue"
description: >-
  Opens a labeled GitHub issue when a workflow job fails, so failures get
  triaged instead of silently sitting red in the Actions tab. Call this from
  a step with `if: failure()`. Labels follow the repo-wide convention in
  .claude/skills/gha-ci-failure-triage/SKILL.md — always `bug` + a component
  label, plus `urgent` for P1 and a `P1`/`P2`/`P3` priority label.

inputs:
  component:
    description: >-
      Short slug for what failed (e.g. ci, deploy, migrate, crawler,
      enrich). Applied as a label and used in the issue title.
    required: true
  priority:
    description: "P1, P2, or P3 — see SKILL.md for the mapping."
    required: true
  urgent:
    description: "Add the 'urgent' label on top of bug/component/priority."
    required: false
    default: "false"
  summary:
    description: "One-line description of what failed, for the issue body."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: File failure issue
      uses: actions/github-script@v7
      with:
        script: |
          const component = ${{ toJSON(inputs.component) }};
          const priority = ${{ toJSON(inputs.priority) }};
          const urgent = ${{ toJSON(inputs.urgent) }} === 'true';
          const summary = ${{ toJSON(inputs.summary) }};

          const labels = ['bug', priority, component];
          if (urgent) labels.push('urgent');

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const date = new Date().toISOString().split('T')[0];

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[${component}] Workflow failed - ${date}`,
            body: [
              `## ${component} failure`,
              '',
              summary ? summary : `The \`${component}\` job failed.`,
              '',
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              `**Workflow run:** ${runUrl}`,
              `**Priority:** ${priority}`,
              '',
              'Investigate and fix before merging further changes.',
            ].join('\n'),
            labels,
          });
